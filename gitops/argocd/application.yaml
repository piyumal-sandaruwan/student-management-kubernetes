# Review and replace the repository URL, target revision, and path before applying.
# Automated sync intentionally remains disabled until the remote branch and overlay
# have been pushed and validated, and the destination cluster is confirmed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-management
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/piyumal-sandaruwan/student-management-kubernetes.git
    targetRevision: main
    path: gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: student-management
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
