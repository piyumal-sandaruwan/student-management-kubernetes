# Argo CD tracks the verified GitHub repository's main branch production overlay.
# Synchronization remains manual; review the Application diff before each sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-management
  namespace: argocd
spec:
  project: student-management
  source:
    repoURL: https://github.com/piyumal-sandaruwan/student-management-kubernetes.git
    targetRevision: main
    path: gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: student-management
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
